ference{font-size:12px;line-height:1.55;margin-bottom:13px}.reference span{color:var(--muted)}.reference:target{background:var(--accentbg);padding:8px;border-radius:8px}.footer{font-size:12px;color:var(--muted);padding-top:20px;border-top:1px solid var(--line);margin-top:16px}.examples{display:flex;align-items:center;gap:8px}.exselect{font-size:12px}.smallbutton{font-size:12px;white-space:nowrap;padding:10px}.hidden{display:none!important}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:13px;z-index:10;box-shadow:var(--shadow)}.printonly{display:none}.signed{display:flex;gap:4px}.signed input{min-width:0}.signbutton{padding:7px;min-width:32px}.full{grid-column:1/-1}.spacer{height:14px}.reporttools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.reporttools button{font-size:12px}.divider{height:1px;background:var(--line);margin:16px 0}.strong{color:var(--fg)}.nowrap{white-space:nowrap}

<script>
'use strict';
/* Gasometria Intraoperatória v1.2.3 — 2026-11-02.
   Single-file, deterministic, local-only. No requests, analytics or patient persistence.
   Hypotheses are deliberately separated from measured facts. No automated drug doses.
   Adult reference framework. See METHODS and REF for conventions and evidence. */
let lang='pt';
const T=(pt,en)=>lang==='pt'?pt:en;
const N=(v,d=1)=>Number.isFinite(v)?v.toLocaleString(lang==='pt'?'pt-BR':'en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const present=v=>typeof v==='number'&&Number.isFinite(v);
function parseNumber(s){if(s===null||s===undefined||String(s).trim()==='')return null;const v=String(s).trim();if(!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(v))return NaN;return Number(v.replace(',','.'));}
const REF=[
['Park MAJ, Cave G, Freebairn RC. Metabolic acidosis in anaesthesia and critical care. BJA Education. 2024;24:91–99.','https://pmc.ncbi.nlm.nih.gov/articles/PMC10874758/'],
['Park M, Sidebotham D. Metabolic alkalosis and mixed acid–base disturbance in anaesthesia and critical care. BJA Education. 2023;23:128–135.','https://pmc.ncbi.nlm.nih.gov/articles/PMC10028421/'],
['Pippalapalli J, Lumb AB. The respiratory system and acid–base disorders. BJA Education. 2023;23:221–228.','https://pmc.ncbi.nlm.nih.gov/articles/PMC10201398/'],
['Achanti A, Szerlip HM. Acid-Base Disorders in the Critically Ill Patient. CJASN. 2023;18:102–112.','https://pmc.ncbi.nlm.nih.gov/articles/PMC10101555/'],
['Do C, Vasquez PC, Soleimani M. Metabolic Alkalosis Pathogenesis, Diagnosis, and Treatment: Core Curriculum 2022. AJKD. 2022;80:536–551.','https://pmc.ncbi.nlm.nih.gov/articles/PMC10947768/'],
['Duška F et al. A pragmatic approach to complex acid base disturbances of critical illness: the “Stewart light”. Intensive Care Med. 2026;52:1322–1325.','https://pmc.ncbi.nlm.nih.gov/articles/PMC13269502/'],
['Jung B et al. BICARICU-2. JAMA. 2025;334:2000–2010.','https://jamanetwork.com/journals/jama/fullarticle/2840824'],
['SODa-BIC Investigators. Sodium Bicarbonate for Critically Ill Adults with Metabolic Acidosis and Shock. NEJM. 2026;395:1062–1074.','https://www.nejm.org/doi/10.1056/NEJMoa2600526'],
['Resuscitation Council UK. Special circumstances guidelines — hyper/hypokalaemia. 2025.','https://www.resus.org.uk/professional-library/2025-resuscitation-guidelines/special-circumstances-guidelines'],
['Young CC et al. Lung-protective ventilation for the surgical patient: international expert panel-based consensus recommendations. BJA. 2019.','https://pubmed.ncbi.nlm.nih.gov/31587835/'],
['Lee GR. Clinical applications of blood gas analysis: a comparative review of arterial and venous blood gas monitoring in critical care. Acute Crit Care. 2025;40:153–159.','https://pmc.ncbi.nlm.nih.gov/articles/PMC12151744/'],
['American Diabetes Association. Diabetes Care in the Hospital: Standards of Care in Diabetes—2026. Diabetes Care. 2026;49(Suppl 1).','https://diabetesjournals.org/care/article/49/Supplement_1/S339/163925/16-Diabetes-Care-in-the-Hospital-Standards-of-Care'],
['Rossaint R et al. The European guideline on management of major bleeding and coagulopathy following trauma: sixth edition. Crit Care. 2023.','https://pmc.ncbi.nlm.nih.gov/articles/PMC9977110/'],
['Wahba A et al. 2024 EACTS/EACTAIC/EBCP Guidelines on cardiopulmonary bypass in adult cardiac surgery. Eur J Cardiothorac Surg. 2025;67:ezae354.','https://doi.org/10.1093/ejcts/ezae354'],
['Siemens Healthineers. RAPIDPoint 500e Operator’s Guide. Rev. E, 2023. Patient Temperature Correction, p. F-17. Equações usadas para estimativas de pH/PCO₂.','https://doclib.siemens-healthineers.com/rest/v1/view?document-id=858615']
];

// Temperature conversion of the SAME sample; it does not predict response to treatment.
// Siemens RAPIDPoint 500e, Rev E, F-17. pH37-dependent coefficient; log10 for PCO2.
function temperaturePair(ph,co2,temp,basis='37'){
 if(![ph,co2,temp].every(present)||temp<15||temp>42||co2<=0||!['37','corrected'].includes(basis))return null;
 const dt=temp-37,factor=Math.pow(10,.019*dt),den=1-.0065*dt;
 const ph37=basis==='37'?ph:(ph-.0334*dt)/den;
 const co237=basis==='37'?co2:co2/factor;
 return {ph37,co237,phT:basis==='corrected'?ph:ph37-(.0147+.0065*(ph37-7.4))*dt,co2T:basis==='corrected'?co2:co237*factor};
}
function temperatureAnalysis(d){
 if(!present(d.temp))return null;
 const pair=temperaturePair(d.ph,d.co2,d.temp,d.basis);if(!pair)return null;
 const alpha=temperaturePair(7.4,40,d.temp,'37'),phstat=temperaturePair(7.4,40,d.temp,'corrected');
 const selected=d.strategy==='alpha'?{ph:pair.ph37,co2:pair.co237,basis:'37'}:d.strategy==='phstat'?{ph:pair.phT,co2:pair.co2T,basis:'T'}:null;
 return {temp:d.temp,basis:d.basis,strategy:d.strategy,estimated37:d.basis==='corrected',...pair,alpha,phstat,selected};
}
function temperatureGuidance(r){
 const d=r.data,t=r.temperature;
 if(d.sample!=='arterial')return T('A conversão descreve a amostra venosa. As referências de PaCO₂ para alpha-stat/pH-stat exigem amostra arterial; não use PCO₂ venosa para orientar essa estratégia.','Conversion describes the venous sample. Arterial PaCO₂ is required for alpha-stat/pH-stat assessment; do not use venous PCO₂ to guide this strategy.');
 if(!t)return T('Informe a temperatura central no momento da coleta e confirme a estratégia com a equipe. Durante CEC, a eliminação de CO₂ depende do circuito; as regras usuais de compensação não são aplicadas automaticamente.','Enter core temperature at sampling and confirm the strategy with the team. During CPB, CO₂ clearance depends on the circuit; conventional compensation rules are not applied automatically.');
 if(t.strategy==='alpha')return T('Alpha-stat usa a leitura a 37 °C. Na hipotermia, pH(T) maior e PCO₂(T) menor podem decorrer da temperatura; isso, isoladamente, não indica adicionar CO₂.','Alpha-stat uses the 37 °C reading. During hypothermia, higher pH(T) and lower PCO₂(T) can reflect temperature; this alone does not indicate adding CO₂.');
 if(t.strategy==='phstat')return T('pH-stat usa a leitura à temperatura do paciente. Na hipotermia, PCO₂ a 37 °C mais alta pode ser intencional: não aumente a eliminação de CO₂ só para trazê-la a 40 mmHg. Confirme fase, protocolo e componente metabólico.','pH-stat uses readings at patient temperature. During hypothermia, higher PCO₂ at 37 °C may be intentional: do not increase CO₂ clearance solely to bring it to 40 mmHg. Confirm phase, protocol and the metabolic component.');
 return T('Comparação de referências; nenhuma estratégia foi escolhida. Informe a estratégia realmente utilizada. Uma gasometria isolada não permite deduzi-la.','Reference comparison; no strategy was selected. Specify the strategy actually in use. A single blood gas cannot establish it.');
}
function temperatureReport(r){
 const t=r.temperature;if(!t&&!r.data.cpb)return [];
 const lines=[T('TEMPERATURA · ALPHA-STAT / pH-STAT','TEMPERATURE · ALPHA-STAT / pH-STAT')];
 if(t){lines.push(`${T('Temperatura central na coleta','Core temperature at sampling')}: ${N(t.temp)} °C`,`${T('A 37 °C','At 37 °C')} (${t.estimated37?T('estimado pelo app','estimated by app'):T('informado','entered')}): pH ${N(t.ph37,3)}; PCO₂ ${N(t.co237)} mmHg`,`${T('À temperatura do paciente','At patient temperature')} (${t.estimated37?T('informado / já corrigido','entered / already corrected'):T('estimado pelo app','estimated by app')}): pH ${N(t.phT,3)}; PCO₂ ${N(t.co2T)} mmHg`,`${T('Estratégia informada','Entered strategy')}: ${t.strategy==='alpha'?'Alpha-stat':t.strategy==='phstat'?'pH-stat':T('somente comparar','comparison only')}`,T('Referências conceituais, sem prescrição de metas:','Conceptual references, not prescribed targets:'),`Alpha-stat: 37 °C 7.400 / 40 mmHg; ${N(t.temp)} °C ${N(t.alpha.phT,3)} / ${N(t.alpha.co2T)} mmHg`,`pH-stat: 37 °C ${N(t.phstat.ph37,3)} / ${N(t.phstat.co237)} mmHg; ${N(t.temp)} °C 7.400 / 40 mmHg`);}
 lines.push(temperatureGuidance(r),T('Conversões aproximadas; preferir os pares reportados pelo gasômetro. HCO₃⁻, SBE, AG/deltas e PO₂ usam a base de 37 °C. PO₂ não é convertida.','Approximate conversions; prefer paired analyzer-reported results. HCO₃⁻, SBE, AG/deltas and PO₂ use the 37 °C basis. PO₂ is not converted.'));
 return lines;
}
function renderTemperature(r){
 const t=r.temperature;if(!t)return '';
 const arterial=r.data.sample==='arterial',gas=arterial?'PaCO₂':'PCO₂';
 const selected=t.selected&&arterial?`<div class="compensation"><strong>${T('Estratégia informada','Entered strategy')}: ${t.strategy==='alpha'?'Alpha-stat':'pH-stat'}</strong><span>${T('Leitura a considerar','Reading to consider')}: <b>pH ${N(t.selected.ph,3)}</b> · <b>${gas} ${N(t.selected.co2)} mmHg</b> (${t.selected.basis==='37'?'37':N(t.temp)} °C).</span><span class="hint">${T('Referência conceitual: pH 7,40 / PaCO₂ 40. Desvio não equivale a indicação automática de intervenção.','Conceptual reference: pH 7.40 / PaCO₂ 40. A deviation is not an automatic indication for intervention.')}</span></div>`:'';
 return `<div class="card" id="temperatureResult"><div class="eyebrow">${T('Temperatura · análise complementar','Temperature · complementary analysis')}</div><h2>Alpha-stat / pH-stat</h2><p class="hint">${T('Temperatura central na coleta','Core temperature at sampling')}: <strong>${N(t.temp)} °C</strong>${r.data.cpb?' · '+T('CEC informada','CPB reported'):''}</p><div class="calcwrap"><table class="calc temp-table"><thead><tr><th>${T('Mesma amostra','Same sample')}</th><th>pH</th><th>${gas}<br>mmHg</th></tr></thead><tbody><tr><td>37 °C <small>${t.estimated37?T('estimado pelo app','estimated by app'):T('informado','entered')}</small></td><td>${N(t.ph37,3)}</td><td>${N(t.co237)}</td></tr><tr><td>${N(t.temp)} °C <small>${t.estimated37?T('informado / já corrigido','entered / already corrected'):T('estimado pelo app','estimated by app')}</small></td><td>${N(t.phT,3)}</td><td>${N(t.co2T)}</td></tr></tbody></table></div>${selected}<p class="hint" style="margin-top:14px">${esc(temperatureGuidance(r))}${refs([14,15])}</p>
 ${t.temp===37?`<p class="hint">${T('A 37 °C, as referências das duas estratégias coincidem.','At 37 °C, both strategies share the same reference values.')}</p>`:''}

function metabolic(kind){if(r.specialContext)return;const e=kind==='MA'?1.5*h+8:.7*h+20;const dev=co2<e-2?'RK':co2>e+2?'RA':null;r.compensation={type:'metabolic',kind,expected:e,measured:co2,deviation:dev};calc(kind==='MA'?T('Winter: PaCO₂ esperada','Winter: expected PaCO₂'):T('PaCO₂ na alcalose metabólica','PaCO₂ in metabolic alkalosis'),`${N(e-2)}–${N(e+2)} mmHg`,kind==='MA'?'1.5 × HCO₃⁻ + 8 ± 2':'0.7 × HCO₃⁻ + 20 ± 2');if(dev)diag(dev,T('Componente respiratório associado provável: ','Likely associated respiratory component: ')+labels[dev].toLowerCase()+'.');else r.facts.push(T('PaCO₂ dentro da faixa estimada de resposta ao distúrbio metabólico.','PaCO₂ within the estimated response range for the metabolic disturbance.'));if(kind==='MK')r.limitations.push(T('Compensação da alcalose é variável; a faixa ±2 segue a BJA Education. Pequenos desvios exigem contexto, não um diagnóstico rígido.','Alkalosis compensation is variable; ±2 follows BJA Education. Small deviations require context, not a rigid diagnosis.'));}

<div class="card"><details class="fold" id="calculationDetails"><summary>${T('Ver cálculos e fórmulas','View calculations and formulas')}</summary><div class="calcwrap"><table class="calc"><thead><tr><th>${T('Medida','Measure')}</th><th>${T('Resultado','Result')}</th><th>${T('Fórmula / interpretação','Formula / interpretation')}</th></tr></thead><tbody>${r.calculations.map(c=>`<tr><td>${esc(c.label)}</td><td>${esc(c.value)}</td><td>${esc(c.note)}</td></tr>`).join('')}</tbody></table></div><p class="hint" style="margin-top:12px">${T('Arredondamento apenas na exibição. Fórmulas de compensação são estimativas, não limites fisiológicos absolutos.','Rounding is for display only. Compensation formulas are estimates, not absolute physiological limits.')}${refs([2,4,6])}</p></details></div>
${r.limitations.length?`<div class="card"><details class="fold" id="limitationDetails"><summary>${T('Limites desta análise','Limits of this analysis')} (${r.limitations.length})</summary><ul class="resultlist hint">${r.limitations.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details></div>`:''}`;
document.getElementById('copyBtn').onclick=copyReport;
document.getElementById('printBtn').onclick=()=>window.print();
document.getElementById('editBtn').onclick=()=>{document.getElementById('entry').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('ph').focus({preventScroll:true})};

function reportText(){if(!lastResult||isDirty||lastResult.errors.length)return '';const r=lastResult;const lines=[T('GASOMETRIA INTRAOPERATÓRIA — APOIO À DECISÃO','INTRAOPERATIVE BLOOD GAS — DECISION SUPPORT'),T('Protótipo não validado clinicamente. Revisar antes de usar no cuidado.','Prototype not clinically validated. Review before use in care.'),reportDate?reportDate.toLocaleString(lang==='pt'?'pt-BR':'en-US'):'',''];
if(activeExample)lines.push(T('CASO SIMULADO — para estudo; não corresponde a uma avaliação clínica real.','SIMULATED CASE — for learning; not an actual clinical assessment.'));
lines.push(T('Dados informados:','Entered values:'));for(const [id,a]of Object.entries(FIELD_META))if(present(lastData[id]))lines.push(`${T(a[0],a[1])}: ${N(lastData[id],id==='ph'?3:id==='ica'?2:1)} ${a[2]}`);
for(const id of ['sample','vent','primary','duration','volume','aki','basis','population','strategy']){const el=document.getElementById(id);lines.push(el.parentElement.childNodes[0].textContent+': '+el.options[el.selectedIndex].text)}
for(const [id,p,e]of CHECKS)lines.push(`${T(p,e)}: ${lastData[id]?T('sim','yes'):T('não informado','not reported')}`);
lines.push('',r.title,...r.alerts.map(a=>a.title+': '+a.text),...r.diagnoses,...r.facts,'',T('Cálculos:','Calculations:'),...r.calculations.map(c=>c.label+': '+c.value+' | '+c.note),'',...temperatureReport(r),'',T('Orientações a considerar:','Guidance to consider:'),...r.actions.map(a=>a.title+': '+a.text+' '+a.refs.map(n=>'['+n+']').join(' ')),'',T('Limitações:','Limitations:'),...r.limitations,'',T('Referências:','References:'),...REF.map(([t,u],i)=>`[${i+1}] ${t} ${u}`),'v1.2.3 — 2026-11-02');return lines.join('\n');}
async function copyReport(){const txt=reportText();if(!txt)return;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(txt);else{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.top='0';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy')}toast(T('Relatório copiado. Revise antes de registrar.','Report copied. Review before documenting.'));}catch{const panel=document.createElement('div');panel.className='card';const label=document.createElement('p');label.textContent=T('Cópia automática indisponível. Selecione e copie o texto abaixo.','Automatic copying unavailable. Select and copy the text below.');const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='width:100%;min-height:240px;font:13px monospace';ta.readOnly=true;panel.append(label,ta);document.getElementById('results').prepend(panel);ta.select();}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.add('hidden'),3200)}
function drawMethods(){document.getElementById('methods').innerHTML=`<details style="border:0;margin:0;padding:0"><summary>${T('Método, alcance e limites','Method, scope and limitations')}</summary><div class="fields two"><div><h3>${T('Interpretação tradicional','Traditional interpretation')}</h3><p class="hint">${T('Faixas operacionais: pH 7,35–7,45; PCO₂ 35–45 mmHg; HCO₃⁻ 22–26 mmol/L. A seleção inicial é uma heurística explícita: considera a direção do pH, CO₂ e bicarbonato. Se o pH estiver preservado com ambos alterados na mesma direção, apresenta hipóteses alternativas. Não determina duração respiratória pelos números.','Operational ranges: pH 7.35–7.45; PCO₂ 35–45 mmHg; HCO₃⁻ 22–26 mmol/L. Initial selection is an explicit heuristic based on the direction of pH, CO₂ and bicarbonate. Preserved pH with both values shifted in the same direction produces alternative hypotheses. Respiratory duration is not inferred from numbers.')}</p><p class="hint">${T('Winter: 1,5 × HCO₃⁻ + 8 ±2. Alcalose: 0,7 × HCO₃⁻ + 20 ±2. Resposta respiratória: por 10 mmHg de PCO₂, HCO₃⁻ muda +1/+3,5 (acidose aguda/crônica) ou −2/−5 (alcalose aguda/crônica). O aplicativo adota tolerância operacional ±2 mmol/L; fórmulas e tolerâncias variam entre referências.','Winter: 1.5 × HCO₃⁻ + 8 ±2. Alkalosis: 0.7 × HCO₃⁻ + 20 ±2. Respiratory response: per 10 mmHg PCO₂, HCO₃⁻ changes +1/+3.5 (acute/chronic acidosis) or −2/−5 (acute/chronic alkalosis). This app uses an operational ±2 mmol/L tolerance; formulas and tolerances vary among sources.')}${refs([2,3,4])}</p></div><div><h3>${T('AG e processos metabólicos','AG and metabolic processes')}</h3><p class="hint">${T('AG = Na − Cl − HCO₃⁻ (ou CO₂ total), sem K⁺; correção = +2,5 × (4 − albumina em g/dL). Basal e limite superior padrão: 12 mEq/L, editáveis conforme método. AG/deltas não são classificados se CO₂ total e HCO₃⁻ diferirem >4 mmol/L (limiar operacional de conferência). Deltas só com AG elevado: ΔAG = AG corrigido − basal; ΔHCO₃⁻ = 24 − bicarbonato usado no AG. Delta gap = ΔAG − ΔHCO₃⁻. Desvios >+6 ou <−6 são pistas, não confirmação de outra doença; as hipóteses automáticas exigem elevação do AG >2 acima do limite. O delta isolado não aciona tratamento de alcalose.','AG = Na − Cl − HCO₃⁻ (or total CO₂), excluding K⁺; correction = +2.5 × (4 − albumin in g/dL). Default baseline and upper limit: 12 mEq/L, editable for the lab method. AG/delta classification is withheld if total CO₂ and HCO₃⁻ differ by >4 mmol/L (an operational review threshold). Deltas are only used with elevated AG: ΔAG = corrected AG − baseline; ΔHCO₃⁻ = 24 − bicarbonate used for AG. Delta gap = ΔAG − ΔHCO₃⁻. Values >+6 or <−6 are clues, not confirmation of another disease; automatic hypotheses require AG >2 above the upper limit. A delta alone does not trigger alkalosis treatment.')}</p><p class="hint">${T('Razão delta não calculada quando ΔHCO₃⁻ ≤2. Hipoalbuminemia, disfunção renal, fase de recuperação e hipercapnia prévia limitam inferências. Um AG normal não exclui lactato elevado.','Delta ratio is omitted when ΔHCO₃⁻ ≤2. Hypoalbuminemia, renal dysfunction, recovery phase and prior hypercapnia limit inferences. A normal AG does not exclude elevated lactate.')}${refs([1,4])}</p></div><div><h3>Stewart light</h3><p class="hint">${T('Disponível com Na, Cl, albumina e SBE. SBE SID = Na − Cl − referência; referência 35, ajustada para 35 + 15 × (7,4 − pH) fora de 7,30–7,50. SBE Alb = 0,3 × (40 − albumina em g/L). SBE UI = SBE − SBE SID − SBE Alb. O residual inclui lactato. É uma decomposição aproximada, sem cálculo completo de SID/SIG, nem gatilho terapêutico.','Available with Na, Cl, albumin and SBE. SBE SID = Na − Cl − reference; reference is 35, adjusted to 35 + 15 × (7.4 − pH) outside 7.30–7.50. SBE Alb = 0.3 × (40 − albumin in g/L). SBE UI = SBE − SBE SID − SBE Alb. The residual includes lactate. This is an approximate partition, not a full SID/SIG calculation or a treatment trigger.')}${refs([6])}</p></div><div><h3>${T('Escopo e uso','Scope and use')}</h3><p class="hint">${T('Adultos; interpretação convencional na base de 37 °C. O módulo opcional de temperatura compara alpha-stat/pH-stat; não constitui protocolo de perfusão, hipotermia profunda, pediatria, gestação, ECMO ou intoxicações. A gasometria não define sozinha volemia, choque, SDRA, diagnóstico etiológico ou necessidade de transfusão. As orientações são caminhos de avaliação, sem doses ou prescrição automática.','Adults; conventional interpretation uses the 37 °C basis. The optional temperature module compares alpha-stat/pH-stat; it is not a perfusion, deep hypothermia, pediatric, pregnancy, ECMO or poisoning protocol. A blood gas alone cannot establish volume status, shock, ARDS, etiology or transfusion need. Guidance provides assessment pathways, with no automated doses or prescriptions.')}</p><p class="hint">${T('BICARICU-2 (UTI, acidemia grave + LRA): sem redução da mortalidade em 90 dias; menor uso de TRS como desfecho secundário. SODa-BIC (UTI, acidose + vasopressor): sem redução do composto renal/morte em 30 dias. Extrapolação para centro cirúrgico exige julgamento.','BICARICU-2 (ICU, severe acidemia + AKI): no reduction in 90-day mortality; lower RRT use as a secondary outcome. SODa-BIC (ICU, acidosis + vasopressors): no reduction in the 30-day renal/death composite. Extrapolation to the OR requires judgment.')}${refs([7,8])}</p></div></div></details>`}
function drawRefs(){document.getElementById('references').innerHTML=`<details class="fold" id="referenceDetails"><summary>${T('Referências clínicas','Clinical references')}</summary><p class="hint">${T('A numeração acompanha as orientações. Base da aula de distúrbios acidobásicos, complementada por evidências de tratamento.','Numbers correspond to guidance. Based on the acid–base teaching session, supplemented by treatment evidence.')}</p><div class="fields two">${REF.map(([t,u],i)=>`<div class="reference" id="ref${i+1}"><span>[${i+1}] </span><a href="${u}" target="_blank" rel="noopener noreferrer">${esc(t)}</a></div>`).join('')}</div></details>`}
function setThemeLabel(){const dark=document.documentElement.dataset.theme==='dark';const b=document.getElementById('themeBtn');if(b){b.textContent=dark?T('Claro','Light'):T('Escuro','Dark');b.setAttribute('aria-label',T('Alternar tema','Toggle theme'));}}
